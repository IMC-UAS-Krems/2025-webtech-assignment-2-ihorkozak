<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CharityAid — Donation Shop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>


<section id="welcomePage" class="welcome-container">
  <div class="welcome-content text-center text-white">
    <h1 class="display-3 fw-bold">Aid Restaurant</h1>
    <p class="lead mb-4">Welcome! Click below to start ordering </p>
    <button id="startOrderingBtn" class="btn btn-lg btn-light px-4 py-2">
      Start Ordering
    </button>
  </div>
</section>


<!-- about navbar bootstap https://getbootstrap.com/docs/4.0/components/navbar/ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark d-none" id="mainNavbar">
  <div class="container">
    <a class="navbar-brand" href="#">Aid restaurant</a>

    <!-- here i read about buttons https://www.w3schools.com/bootstrap/bootstrap_buttons.asp  -->
    <!-- about collapse (for some unknown reason it gives me an error 404 when i try to open this link, so i am copying it ) 
         https://getbootstrap.com/docs/5.0/components/collapse/-->
    <button class="btn btn-outline-light ms-auto" data-bs-toggle="offcanvas" data-bs-target="#cartPanel">
      Cart (<span id="cartCount">0</span>)
    </button>
  </div>
</nav>

<main class="container py-4">

  <section id="shopSection" class="d-none">
    <h2 class="mb-4">Donation Items</h2>
    <div id="productsRow" class="row g-3"></div>
  </section>

  <!-- https://getbootstrap.com/docs/4.0/components/card/ -->
  <section id="checkoutSection" class="d-none mt-4">
    <div class="card">
      <div class="card-header"><strong>Checkout</strong></div>
      <div class="card-body">
        <div id="thankYouMessage" class="text-success fw-bold mb-3"></div>

        <!-- novadate attribute https://www.w3schools.com/tags/att_form_novalidate.asp -->
        <form id="checkoutForm" novalidate>
          <div class="mb-3"> <label>Name</label> <input id="name" class="form-control" required></div>
          <div class="mb-3"> <label>Email</label> <input id="email" type="email" class="form-control" required></div>
          <div class="mb-3"> <label>Phone</label> <input id="phone" class="form-control" required></div>
          <div class="mb-3"> <label>Address</label> <input id="address" class="form-control" required></div>
          <div class="mb-3"> <label>ZIP</label> <input id="zip" class="form-control" required></div>

          <button class="btn btn-success w-100">Confirm Purchase</button>
        </form>

        <button id="backToShopBtn" class="btn btn-secondary w-100 mt-3">
          Back to Shop
        </button>

      </div>
    </div>
  </section>

  
  <section id="confirmationSection" class="d-none mt-4">
    <div class="card">
      <div class="card-header">Order Confirmation</div>
      <div class="card-body" id="confirmationBody"></div>

      <button id="goHomeBtn" class="btn btn-secondary w-100 mt-3">
        Back to Shop
      </button>
    </div>
  </section>

</main>

<!-- https://getbootstrap.com/docs/5.0/components/offcanvas/ -->
<div class="offcanvas offcanvas-end" id="cartPanel">
  <div class="offcanvas-header">
    <h5>Your Cart</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body d-flex flex-column">

    <ul class="list-group mb-3" id="cartList"></ul>

    <div class="mt-auto">

      <button id="clearCartBtn" class="btn btn-outline-danger w-100 mb-3">
        Clear Cart
      </button>

      <div class="d-flex justify-content-between">
        <span>Subtotal:</span> <strong id="subtotal">0.00 €</strong>
      </div>
      <div class="d-flex justify-content-between">
        <span>Tax (10%):</span> <strong id="tax">0.00 €</strong>
      </div>
      <div class="d-flex justify-content-between">
        <span>Discount:</span> <strong id="discount">0.00 €</strong>
      </div>
      <hr>
      <div class="d-flex justify-content-between fs-5">
        <span>Total:</span> <strong id="total">0.00 €</strong>
      </div>

      <button id="checkoutBtn" class="btn btn-success w-100 mt-3" disabled>
        Proceed to Checkout
      </button>

    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/scripts.js"></script>
</body>
</html>
